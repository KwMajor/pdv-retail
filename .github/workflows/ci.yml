# CI exigente: estilo, testes, supply chain, frontend e Semgrep (bloqueante).
# Padrões: actions pinadas, least-privilege, --locked, cancel-in-progress.
name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloud-api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: ci
          workspaces: cloud-api
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  backend-test:
    name: backend test + release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cloud-api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pdv
          POSTGRES_PASSWORD: pdv
          POSTGRES_DB: pdv
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pdv -d pdv"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://pdv:pdv@localhost:5432/pdv
      TEST_DATABASE_URL: postgres://pdv:pdv@localhost:5432/pdv_test
      JWT_SECRET: ci-only-secret-com-mais-de-32-chars
      APP_ENV: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: ci
          workspaces: cloud-api
      - name: sqlx-cli
        run: |
          command -v sqlx >/dev/null || cargo install sqlx-cli --no-default-features --features postgres
      - run: sqlx migrate run
      - run: cargo test --locked
      - run: cargo sqlx prepare --check
      - run: cargo build --release --locked

  supply-chain:
    name: cargo-deny + dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          manifest-path: cloud-api/Cargo.toml
          log-level: warn
          command: check
      # dependency-review-action REMOVIDO de propósito: exige GitHub Advanced
      # Security (pago em repo privado). Sinal equivalente já coberto por
      # cargo-deny (advisories Rust) + npm audit (JS). Reavaliar se GHAS entrar.

  frontend:
    name: frontend tsc + build + audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop-client
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-client/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: ./node_modules/.bin/tsc --noEmit
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate

  actions-security:
    name: zizmor (workflows)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: ci
      - name: install zizmor
        run: command -v zizmor >/dev/null || cargo install zizmor --locked
      - run: zizmor --no-online-audits .github/workflows

  semgrep:
    name: semgrep (bloqueante)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    env:
      # Sem telemetria (evita o ruído "Resource not accessible" sem token).
      SEMGREP_SEND_METRICS: off
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: scan
        # Packs explícitos (não `auto`): `auto` exige telemetria ligada,
        # incompatível com SEMGREP_SEND_METRICS=off. Cobertura equivalente
        # para nossa stack, mais `--config .semgrep/rules` (regras próprias).
        run: |
          pip install --quiet semgrep
          semgrep scan --config p/rust --config p/typescript --config p/javascript --config p/secrets --config p/supply-chain --config p/dockerfile --config p/github-actions --config .semgrep/rules --sarif --output semgrep.sarif
      # Best-effort: o GATE é o exit code do scan acima; o upload é só
      # visibilidade (falha em repos sem code scanning habilitado).
      - uses: github/codeql-action/upload-sarif@7999b86c43a865dc79d8923397f35af22de63401 # v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep
